name: CI

# 这套流水线的独特价值在 macOS runner —— 它用系统自带的 Bash 3.2 跑测试，
# 同时覆盖没有 flock 时的 mkdir 目录锁回退路径。只有 Linux runner 的流水线测不到这两者，
# 而 macOS 恰是本项目的主力使用平台。

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS / Bash 3.2
            os: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Show Bash version
        run: bash --version
      - name: Run tests
        env:
          UPDATE_BASH: /bin/bash
        run: make test

  # apt 的真实契约（sudo 的 --preserve-env、debconf、真实升级）在 macOS 上根本
  # 观察不到，只能靠这条。runner 预装了 Docker，直接复用 make verify-apt，
  # 不另写一套验证逻辑。
  verify-apt:
    name: apt contract (containers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Verify the apt path
        run: make verify-apt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck
      # shfmt 的排版规则随版本变化，发行版仓库里的版本与开发者本机常常不一致，
      # 曾因此让同一份代码在本地通过而在 CI 失败。这里固定版本，让门禁可复现。
      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.14.1
        run: |
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version
      - name: Run lint
        run: make lint
